<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NIN Long Slip - {{slip_reference}}</title>
  <style>
    @page {
      size: 1245px 1758px;
      margin: 0;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body { 
      font-family: 'Roboto', Arial, sans-serif; 
      background: white;
      margin: 0;
      padding: 0;
      width: 1245px;
      height: 1758px;
    }
    
    .page {
      position: relative;
      width: 1245px;
      height: 1758px;
    }
    
    .template-bg {
      width: 1245px;
      height: 1758px;
      display: block;
      object-fit: fill;
    }
    
    .data-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    
    .photo-overlay {
      position: absolute;
      top: {{photo_top}};
      left: {{photo_left}};
      width: {{photo_width}};
      height: auto;
      object-fit: cover;
    }
    
    .surname-overlay {
      position: absolute;
      top: {{surname_top}};
      left: {{surname_left}};
      font-size: {{surname_size}};
      font-weight: 700;
      color: #000;
      text-transform: uppercase;
    }
    
    .given-names-overlay {
      position: absolute;
      top: {{names_top}};
      left: {{names_left}};
      font-size: {{names_size}};
      font-weight: 700;
      color: #000;
      text-transform: uppercase;
    }

    .firstname-overlay {
      position: absolute;
      top: {{firstname_top}};
      left: {{firstname_left}};
      font-size: {{firstname_size}};
      font-weight: 700;
      color: #000;
      text-transform: uppercase;
    }

    .middlename-overlay {
      position: absolute;
      top: {{middlename_top}};
      left: {{middlename_left}};
      font-size: {{middlename_size}};
      font-weight: 700;
      color: #000;
      text-transform: uppercase;
    }
    
    .sex-overlay {
      position: absolute;
      top: {{sex_top}};
      left: {{sex_left}};
      font-size: {{sex_size}};
      font-weight: 700;
      color: #000;
    }

    .nin-overlay {
      position: absolute;
      top: {{nin_top}};
      left: {{nin_left}};
      font-size: {{nin_size}};
      font-weight: 700;
      color: #000;
      letter-spacing: 2px;
      font-family: Arial, Helvetica, sans-serif;
    }

    .tracking-overlay, .tracking-id-overlay {
      position: absolute;
      top: {{tracking_top}};
      left: {{tracking_left}};
      font-size: {{tracking_size}};
      font-weight: 600;
      color: #000;
    }

    .address-overlay {
      position: absolute;
      top: {{address_top}};
      left: {{address_left}};
      font-size: {{address_size}};
      font-weight: 600;
      color: #000;
      max-width: 30%;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.4;
    }
    {{hidden_fields_css}}
    {{field_font_css}}
  </style>
</head>
<body>
  <div class="page">
    <img src="{{template_image}}" alt="Template" class="template-bg">
    
    <div class="data-overlay">
      <img src="{{photo}}" alt="Photo" class="photo-overlay">
      <div class="surname-overlay">{{surname}}</div>
      <div class="firstname-overlay">{{firstname}}</div>
      <div class="middlename-overlay">{{middlename}}</div>
      <div class="sex-overlay">{{gender}}</div>
      <div class="nin-overlay">{{nin}}</div>
      <div class="tracking-overlay">{{tracking_id}}</div>
      <div class="address-overlay">{{address}}</div>
    </div>
  </div>
</body>
</html>
